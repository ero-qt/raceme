name: release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main and in the changelog
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          grep -q "^## \[$GITHUB_REF_NAME\] - " changelog.md
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - run: bun run test
      - run: bun run test:e2e
      - run: bun run release
        env:
          RACEME_BASE_PATH: apps/raceme
      - name: Take the release notes from the changelog
        run: |
          awk -v heading="## [$GITHUB_REF_NAME] - " \
            'index($0, heading) == 1 { found = 1; next } found && /^(## )?\[/ { exit } found' \
            changelog.md > notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            raceme.tar.gz
            notes.md

  # Only this job can sign and publish. It runs none of the project's own code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: raceme.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" raceme.tar.gz.sigstore.json
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" raceme.tar.gz raceme.tar.gz.sigstore.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" raceme.tar.gz raceme.tar.gz.sigstore.json \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$GITHUB_REF_NAME" --notes-file notes.md
          fi
