name: release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main and in the changelog
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          grep -q "^## \[$GITHUB_REF_NAME\] - " changelog.md
      - name: Check ci passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci" \
            --jq '[.check_runs[].conclusion] | first')
          if [[ "$conclusion" != success ]]; then
            echo "::error::ci on $GITHUB_SHA is '$conclusion', wait for it to pass and rerun this job"
            exit 1
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install packages
        run: bun install --frozen-lockfile
      - name: Build the tarball
        run: bun run release
        env:
          RACEME_BASE_PATH: apps/raceme
      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: raceme.tar.gz

  # Only this job can sign and publish. It runs none of the project's own code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the tarball
        uses: actions/download-artifact@v8
        with:
          name: release
      - name: Attest the tarball
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: raceme.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" raceme.tar.gz.sigstore.json
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" raceme.tar.gz raceme.tar.gz.sigstore.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" raceme.tar.gz raceme.tar.gz.sigstore.json \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$GITHUB_REF_NAME" --generate-notes
          fi
